services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./context:/app/context
      - ./outputs:/app/outputs
    restart: unless-stopped

  # Optional — only starts/matters if an agent's skills/*.md sets `provider: omniroute`.
  # Self-hosted, MIT-licensed, free multi-provider LLM gateway (OpenAI-compatible Chat
  # Completions API in front of 300+ providers, with model-priority routing configured
  # in its own dashboard at http://localhost:20128).
  # Once it's up, set OMNIROUTE_BASE_URL=http://omniroute:20128/v1 in .env.
  omniroute:
    image: diegosouzapw/omniroute:latest
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped

volumes:
  omniroute-data:
